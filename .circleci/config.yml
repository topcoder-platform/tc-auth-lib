version: 2.1
jobs:
  validate:
    docker: &id002
    - image: node:22.23.4-bookworm@sha256:18a6d90fd60542269850c80ca03b29b1d9b14d6b221ac7ee8e35b0d33ef904bd
    steps:
    - checkout
    - &id001
      run:
        name: Verify deployment helpers v2.0.9
        command: 'set -euo pipefail

          git init --quiet /tmp/tc-deploy-scripts

          git -C /tmp/tc-deploy-scripts remote add origin https://github.com/topcoder-platform/tc-deploy-scripts.git

          git -C /tmp/tc-deploy-scripts fetch --quiet --depth 1 origin refs/tags/v2.0.9

          git -C /tmp/tc-deploy-scripts checkout --quiet --detach FETCH_HEAD

          test "$(git -C /tmp/tc-deploy-scripts rev-parse HEAD)" = dc06de730f068a230efa9d5f4d4d9c80782d3bfb

          '
    - run:
        name: Validate authentication and deployment boundaries
        command: 'npm test

          python3 -m unittest discover -s deploy/tests -v

          '
  prepare-config:
    docker: &id004
    - image: cimg/aws@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
    parameters: &id003
      environment:
        type: enum
        enum:
        - dev
        - prod
    steps:
    - checkout
    - *id001
    - run:
        name: Test pinned AWS CLI then read public configuration using OIDC
        command: 'python3 -m unittest discover -s deploy/tests -p test_aws_cli.py
          -v

          python3 -I deploy/site.py config --manifest deploy/<< parameters.environment
          >>.json'
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - browser-config.json
  build:
    docker: *id002
    parameters: *id003
    steps:
    - checkout
    - *id001
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Build both public asset trees and record provenance
        command: python3 -I deploy/site.py build --manifest deploy/<< parameters.environment
          >>.json
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - build
        - artifact.json
  deploy:
    docker: *id004
    parameters: *id003
    steps:
    - checkout
    - *id001
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Publish and verify accounts and hosted Auth0 assets using OIDC
        command: python3 -I deploy/site.py deploy --manifest deploy/<< parameters.environment
          >>.json
        no_output_timeout: 45m
    - store_artifacts:
        path: /tmp/release/deployment-receipt.json
workflows:
  release:
    jobs:
    - validate
    - prepare-config:
        name: config-dev
        environment: dev
        requires:
        - validate
        context: tc-auth-lib-dev-build
        filters: &id005
          branches:
            only: dev
          tags:
            ignore: /.*/
    - build:
        name: build-dev
        environment: dev
        requires:
        - config-dev
        filters: *id005
    - deploy:
        name: deploy-dev
        environment: dev
        requires:
        - build-dev
        context: tc-auth-lib-dev-deploy
        filters: *id005
        serial-group: << pipeline.project.slug >>/deploy-dev
    - prepare-config:
        name: config-prod
        environment: prod
        requires:
        - validate
        context: tc-auth-lib-prod-build
        filters: &id006
          branches:
            only: master
          tags:
            ignore: /.*/
    - build:
        name: build-prod
        environment: prod
        requires:
        - config-prod
        filters: *id006
    - deploy:
        name: deploy-prod
        environment: prod
        requires:
        - build-prod
        context: tc-auth-lib-prod-deploy
        filters: *id006
        serial-group: << pipeline.project.slug >>/deploy-prod
